name: lint

# ruff (import order + lint, config in pyproject.toml) on every PR and every push to main. BLOCKING.
# The repo is ruff-clean, so this is a whole-repo check — no changed-files ratchet to maintain.
# Same ruff version and config as the local .git/hooks/pre-commit.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (must pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.15.17 check --output-format github .
