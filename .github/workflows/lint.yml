name: lint

# Phase 1 CI — ruff (import order + lint), CPU-only, GitHub-hosted runners.
# Two jobs, matching the "ratchet + informational" rollout:
#   1) ruff-changed  (BLOCKING)     — every .py file a PR adds/modifies must be ruff-clean, anywhere in
#                                     the tree. New code is clean everywhere; touching a legacy file
#                                     means cleaning that file. Violation count can only go down.
#   2) ruff-report   (NON-BLOCKING) — full-repo scan for visibility: inline PR annotations + a per-rule
#                                     count in the job summary, so the remaining backlog stays visible.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-changed:
    name: ruff (changed files — must pass)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need the base branch to diff against

      - uses: astral-sh/setup-uv@v5

      - name: ruff check on changed Python files
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          # Files this PR adds/copies/modifies/renames, relative to the merge-base with the target branch.
          mapfile -d '' files < <(
            git diff -z --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" -- '*.py'
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python files changed — nothing to check."
            exit 0
          fi
          printf '%s\n' "Checking ${#files[@]} changed file(s):" "${files[@]}"
          # --force-exclude so vendored files (extend-exclude in pyproject) are skipped even when
          # passed explicitly on the command line.
          uvx ruff@0.15.17 check --force-exclude --output-format github "${files[@]}"

  ruff-report:
    name: ruff (full repo — informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: ruff report (never blocks)
        run: |
          echo "## ruff — full-repo backlog (informational)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uvx ruff@0.15.17 check . --statistics >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Inline annotations on the PR diff — visible, but the step always succeeds.
          uvx ruff@0.15.17 check . --output-format github || true
