  R_Middle_MCP_Joint:  {kp: 40, kv: 0.5638, effort: [-5, 5]}
  R_Middle_PIP_Joint:  {kp: 20, kv: 0.2491, effort: [-3, 3]}
  R_Ring_ABAD_Joint:   {kp: 20, kv: 0.0969, effort: [-3.5, 3.5]}
  R_Ring_MCP_Joint:    {kp: 40, kv: 0.5638, effort: [-5, 5]}
