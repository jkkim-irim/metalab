  R_Little_ABAD_Joint: {kp: 20, kv: 0.0965, effort: [-3.5, 3.5]}
  R_Little_MCP_Joint:  {kp: 40, kv: 0.5637, effort: [-5, 5]}
  R_Little_PIP_Joint:  {kp: 20, kv: 0.2491, effort: [-3, 3]}
  # Left arm
  L_Shoulder_Pitch_Joint: {kp: 5000, kv: 112.7847, effort: [-120, 120]}
  L_Shoulder_Roll_Joint:  {kp: 5000, kv: 90.3685,  effort: [-120, 120]}
  L_Shoulder_Yaw_Joint:   {kp: 5000, kv: 73.3366,  effort: [-120, 120]}
  L_Elbow_Joint:          {kp: 2000, kv: 41.8896,  effort: [-100, 100]}
  L_Wrist_Yaw_Joint:      {kp: 750,  kv: 4.5803,   effort: [-60, 60]}
