<!doctype html>
<!--
  MetaLab rerun player — opens a .rrd that sits behind our Slack-authenticated CloudFront.

  WHY THIS EXISTS. The stock rerun viewer's `?url=<rrd>` cannot load our recordings, even though the
  viewer and the .rrd are served from the SAME origin. rerun fetches the file through `ehttp`, whose
  wasm backend defaults to `Credentials::Omit` (ehttp types.rs: `#[default] Omit = 0`), so the browser
  sends NO cookies. The request therefore reaches oauth2-proxy unauthenticated, gets a 302 to
  slack.com, and a cors-mode fetch that follows a cross-origin redirect fails as a bare
  "Failed to fetch" — which is exactly what the viewer reports.

  So the fetch has to be OURS: this page pulls the bytes with `credentials: "same-origin"` (the
  oauth2-proxy cookie rides along) and hands them to the viewer over its log channel
  (`open_channel` + `send_rrd_to_channel`). The viewer never touches the network.

  Deployed next to the SDK-matched viewer bundle it loads relatively:
      s3://wirobotics-internal/jkkim/tools/rerun-viewer/<rerun-version>/
  Usage:  .../rerun-viewer/<ver>/rerun_player.html?url=<absolute-or-/abs-path .rrd>
  The bundle is version-pinned because an .rrd only stays readable across adjacent minor versions.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MetaLab · rerun player</title>
<style>
  html { touch-action: manipulation; }
  html, body { overflow: hidden; margin: 0 !important; padding: 0 !important; height: 100%; width: 100%; }
  body { background: #0d1011; color: #c7d0d6;
         font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { margin: 0; padding: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  canvas.hidden { display: none; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px; font-size: 14px; line-height: 1.7; }
  #status.hidden { display: none; }
  #status .err { color: #e88b6a; }
  #status code { background: #1b2124; border-radius: 4px; padding: 1px 5px; font-size: 12.5px;
                 word-break: break-all; }
  #status .hint { color: #7d8a91; font-size: 12.5px; margin-top: 10px; }
</style>
</head>
<body>
  <canvas id="the_canvas_id" class="hidden"></canvas>
  <div id="status">loading viewer…</div>

  <script src="./re_viewer.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const canvasEl = document.getElementById("the_canvas_id");
    const RRD_URL = new URLSearchParams(location.search).get("url");
    const CHANNEL = "metalab";

    const say = (html) => { statusEl.innerHTML = html; statusEl.classList.remove("hidden"); };
    // Loud on purpose: every failure mode here (missing ?url, auth redirect, wrong rrd version) is
    // something the reader must see and act on, so none of them degrade into an empty viewer.
    const die = (title, detail, hint) => say(
      `<div><p class="err"><b>${title}</b></p>${detail ? `<p><code>${detail}</code></p>` : ""}` +
      `${hint ? `<p class="hint">${hint}</p>` : ""}</div>`);

    async function main() {
      if (!RRD_URL) {
        die("No recording requested.", "", "Append <code>?url=&lt;.rrd URL&gt;</code> to this page's address.");
        return;
      }

      // wasm: mirror the bundle's own loader (fetch, then hand the Response to wasm_bindgen).
      say("loading viewer…");
      const wasmRes = await fetch("./re_viewer_bg.wasm");
      if (!wasmRes.ok) {
        die("Could not load the viewer.", `${wasmRes.status} ${wasmRes.statusText}`,
            "The viewer bundle next to this page is missing or unreadable.");
        return;
      }
      await wasm_bindgen(wasmRes);

      const handle = new wasm_bindgen.WebHandle({
        url: [],                    // empty: WE feed the data, the viewer must not fetch anything
        hide_welcome_screen: true,
        enable_history: false,
        persist: false,
      });
      await handle.start(canvasEl);

      // The whole point: our fetch, with cookies. See the header comment.
      say(`fetching recording…`);
      let res;
      try {
        res = await fetch(RRD_URL, { credentials: "same-origin", cache: "no-cache" });
      } catch (e) {
        die("Could not fetch the recording.", String(e),
            "Usually the login session expired: the request was redirected to Slack, which a " +
            "cross-origin fetch cannot follow. Reload this page to re-authenticate.");
        return;
      }
      if (!res.ok) {
        die("Could not fetch the recording.", `${res.status} ${res.statusText} — ${RRD_URL}`,
            "Check that the .rrd exists at that path.");
        return;
      }

      const bytes = new Uint8Array(await res.arrayBuffer());
      say(`decoding ${(bytes.length / 1e6).toFixed(1)} MB…`);
      handle.open_channel(CHANNEL, "metalab-rollout");
      handle.send_rrd_to_channel(CHANNEL, bytes);

      // Leave FOLLOW mode once the recording has settled. rerun's TimeControl defaults to
      // `playing: true, following: true`, which pins the cursor to the newest data — the scene sits frozen
      // on the final frame. SetPlayState(Playing), which set_playing(true) sends, clears `following` and
      // rewinds to the range start when the cursor is at the end. Waiting for the range to stop growing
      // matters: on a partially decoded recording the rewind would land mid-rollout.
      let prev = -1;
      for (let i = 0; i < 400; i++) {
        const rec = handle.get_active_recording_id();
        const r = rec && handle.get_timeline_time_range(rec, "time");
        if (r && r.max > r.min && r.max === prev) { handle.set_playing(rec, true); break; }
        prev = r ? r.max : -1;
        await new Promise((s) => setTimeout(s, 50));
      }

      statusEl.classList.add("hidden");
      canvasEl.classList.remove("hidden");

      // A rerun panic leaves a black canvas otherwise; surface it (version skew shows up here).
      setInterval(() => {
        if (handle.has_panicked()) {
          canvasEl.classList.add("hidden");
          die("The viewer crashed.", handle.panic_message(),
              "Most often the .rrd was written by a different rerun version than this bundle.");
        }
      }, 1000);
    }

    main().catch((e) => die("Unexpected failure.", String(e), "See the developer console."));
  </script>
</body>
</html>
