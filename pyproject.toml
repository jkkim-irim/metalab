[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metalab-learning"
version = "0.0.0"
description = "MetaLab learning — RL train/eval over the sim-service boundary"
requires-python = ">=3.10"
# The trainer and the engine server run in the SAME engine uv env (sim/metalab/setup/<engine>/), which
# already pins torch and the engine; this package is not installed separately for a normal run. Listed
# here so `learning` is importable as a package and its extra runtime needs are recorded.
dependencies = [
    "numpy",
    "tensordict",       # the observation TensorDict crossing the sim-service boundary
    "torch",
    "wandb",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["learning*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]   # import placement, real errors, pyflakes, import sorting
# E701/E702 (one-line if / semicolon-joined statements) are a stylistic choice we don't enforce:
# they're common and harmless in the dense analysis/plotting/sweep scripts (model/, apps/, VLA), and
# gating on them would bury the signals we actually care about (unused imports, undefined names) under
# hundreds of semicolon hits. The rest of E7 (== None, bare except, lambda-assign, ambiguous names) stays.
ignore = ["E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["learning"]
force-sort-within-sections = true       # stdlib > third-party > first-party; alphabetical within
